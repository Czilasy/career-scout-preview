<!doctype html>
<!-- PROTOTYPE ONLY: no production API, database, BOSS source, or login state. -->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>筛选工作台原型（模拟）</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%235fa7ff'/%3E%3C/svg%3E">
  <style>
    :root { color-scheme:dark; --bg:#0b1020; --panel:#111a2d; --line:#293853; --text:#edf3ff; --muted:#9aabc7; --blue:#5fa7ff; --green:#51d49b; --amber:#f4bd62; font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; }
    * { box-sizing:border-box; } html,body { min-height:100%; margin:0; background:var(--bg); color:var(--text); } body { overflow-x:hidden; font-size:14px; }
    button { min-height:30px; padding:4px 9px; border:1px solid var(--line); border-radius:6px; background:#1b2a44; color:var(--text); cursor:pointer; font:inherit; } button:hover,button:focus-visible { border-color:var(--blue); outline:none; } button.primary { background:var(--blue); color:#061221; font-weight:700; } button.danger { background:#35202a; color:#ffdce0; } button.quiet { background:transparent; color:var(--muted); }
    .app { min-height:100vh; display:grid; grid-template-columns:238px minmax(0,1fr); } .sidebar { padding:15px; border-right:1px solid var(--line); background:#0d1527; } .brand { font-size:15px; font-weight:750; } .side-section { padding:12px 0; border-top:1px solid var(--line); } .side-title,.note,.history-line { color:var(--muted); font-size:12px; line-height:1.45; } .filter-value { display:flex; justify-content:space-between; margin:7px 0; }
    .main { min-width:0; padding:15px 20px 24px; } .topline,.summary,.toolbar,.actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; } .topline h1 { flex:1; margin:0; font-size:18px; } .badge { padding:3px 8px; border-radius:99px; background:#17233a; color:var(--muted); font-size:12px; } .badge.ok { color:var(--green); } .badge.warn,.parse { color:var(--amber); }
    .summary { margin-top:12px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--muted); } .summary strong { color:var(--text); } .views { display:flex; gap:7px; overflow-x:auto; margin:14px 0 10px; padding-bottom:10px; border-bottom:1px solid var(--line); } .view-button { flex:0 0 auto; background:transparent; color:var(--muted); } .view-button.active { background:#152946; border-color:var(--blue); color:var(--text); } .count { margin-left:5px; color:var(--blue); }
    .toolbar { justify-content:space-between; min-height:34px; margin-bottom:8px; } .toolbar p { margin:0; color:var(--muted); font-size:12px; } .list { display:grid; gap:7px; } .job { display:grid; grid-template-columns:minmax(200px,.8fr) minmax(280px,1.4fr) minmax(260px,1fr); gap:14px; align-items:center; min-height:82px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel); } .title { font-weight:700; } .company,.excerpt { margin-top:4px; color:var(--muted); } .meta { display:flex; gap:8px; flex-wrap:wrap; font-size:12px; } .salary { color:var(--green); font-weight:700; } .actions { justify-content:flex-end; } .failure { width:100%; color:var(--amber); text-align:right; font-size:11px; } .empty { padding:30px; border:1px dashed var(--line); border-radius:8px; color:var(--muted); text-align:center; }
    .prompt { display:flex; gap:7px; align-items:center; flex-wrap:wrap; margin:0 0 8px; padding:8px; border:1px solid #765d2a; border-radius:8px; background:#30291b; color:#ffe1a8; } .modal-backdrop { display:none; } .modal-backdrop.open { display:grid; position:fixed; z-index:5; inset:0; place-items:center; padding:16px; background:#0009; } .modal { width:min(700px,100%); max-height:80vh; overflow:auto; padding:16px; border:1px solid var(--line); border-radius:8px; background:var(--panel); } .modal h2,h3 { margin:0 0 10px; } .modal-row { display:flex; justify-content:space-between; gap:8px; padding:9px 0; border-top:1px solid var(--line); } .modal-actions { display:flex; gap:5px; flex-wrap:wrap; justify-content:flex-end; } .mobile-filter-toggle,.mobile-close,.drawer-backdrop { display:none; }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } } @media (max-width: 720px) { .app { display:block; } .main { padding:12px 10px; } .topline { align-items:flex-start; } .topline h1 { flex-basis:100%; } .mobile-filter-toggle,.mobile-close { display:inline-block; } .sidebar { display:none; } .filters-open .sidebar { display:block; position:fixed; z-index:3; inset:0 auto 0 0; width:min(330px,calc(100vw - 36px)); overflow:auto; box-shadow:12px 0 32px #0008; } .filters-open .drawer-backdrop { display:block; position:fixed; z-index:2; inset:0; border:0; border-radius:0; background:#0008; } .job { grid-template-columns:1fr; gap:6px; } .actions { justify-content:flex-start; } .failure { text-align:left; } }
  </style>
</head>
<body>
  <div id="root"></div><div id="modalRoot"></div><div id="announcer" aria-live="polite"></div>
  <script>
    const RUN_STORAGE_KEY = 'boss-screening-temporary-run-v2';
    const LONG_TERM_STORAGE_KEY = 'boss-screening-long-term-v2';
    const VIEWS = [['matched','符合'],['rejected','不符合'],['pending','待核验'],['interested','感兴趣'],['trash','垃圾桶']];
    const INITIAL_JOBS = [
      {id:'m1',zone:'matched',title:'高级 Python 工程师',company:'星澜数据',salary:'30-45K·14薪',location:'上海·浦东',experience:'5-10年',degree:'本科',jd:'负责数据平台服务和 AI 工作流的稳定交付。'},
      {id:'m2',zone:'matched',title:'后端开发工程师',company:'稻田科技',salary:'25-35K',location:'上海·徐汇',experience:'3-5年',degree:'本科',jd:'负责 API、异步任务与可观测性建设。'},
      {id:'m3',zone:'matched',title:'AI 平台工程师',company:'北极光实验室',salary:'32-48K',location:'上海·杨浦',experience:'3-5年',degree:'本科',jd:'建设模型服务编排、评测与权限平台。'},
      {id:'m4',zone:'matched',title:'Python 服务端工程师',company:'雾森网络',salary:'28-40K',location:'上海·静安',experience:'3-5年',degree:'本科',jd:'为业务中台开发高并发服务与内部工具。'},
      {id:'m5',zone:'matched',title:'数据工程师',company:'进制智能',salary:'26-38K',location:'上海·闵行',experience:'3-5年',degree:'本科',jd:'维护批处理与实时数据链路。'},
      {id:'m6',zone:'matched',title:'平台后端工程师',company:'光年系统',salary:'27-42K',location:'上海·虹口',experience:'3-5年',degree:'本科',jd:'负责多租户平台的接口、权限和发布流程。'},
      {id:'r1',zone:'rejected',title:'Java 架构师',company:'远帆供应链',salary:'45-65K',location:'上海·宝山',experience:'10年以上',degree:'本科',jd:'已完成核验，当前筛选条件下不符合。'},
      {id:'r2',zone:'rejected',title:'算法研究员',company:'量子视野',salary:'35-55K',location:'上海·徐汇',experience:'5-10年',degree:'硕士',jd:'已完成核验，当前筛选条件下不符合。'},
      {id:'p1',zone:'pending',title:'Python 后端工程师',company:'云脉软件',salary:'24-36K',location:'上海·浦东',experience:'3-5年',degree:'本科',jd:'岗位核验等待再次执行。',failure:'AI 核验超时',stage:'AI 核验',attempts:1,retryable:true,lastFailedAt:'2026-07-13 09:42',retryOutcome:'matched'},
      {id:'p2',zone:'pending',title:'数据平台开发',company:'海图科技',salary:'20-30K',location:'上海·长宁',experience:'3-5年',degree:'本科',jd:'岗位字段尚未完成安全核验。',failure:'核验结果无效',stage:'结果校验',attempts:2,retryable:true,lastFailedAt:'2026-07-13 10:03',retryOutcome:'pending'},
      {id:'p3',zone:'pending',title:'业务系统维护',company:'远山服务',salary:'18-26K',location:'上海·普陀',experience:'1-3年',degree:'大专',jd:'等待人工确认来源字段。',failure:'来源字段缺失',stage:'字段核验',attempts:1,retryable:false,lastFailedAt:'2026-07-13 10:08'}
    ];
    let temporaryRun = loadTemporaryRun();
    let longTerm = loadLongTerm();
    let currentView = 'matched';
    let filtersOpen = false;
    let historyOpen = false;
    let cleanupPrompt = false;

    function copy(value) { return JSON.parse(JSON.stringify(value)); }
    function now() { return '模拟当前时间'; }

    // 临时运行结果单独持久化，并带创建时间；只由 31 天清理删除。
    function newTemporaryRun() {
      return {createdAt: now(), jobs: copy(INITIAL_JOBS)};
    }

    function emptyLongTerm() {
      return {interested:{m3:copy(INITIAL_JOBS[2])},notInterested:{},trash:{},userActions:[],cleanupRecords:[]};
    }

    function loadTemporaryRun() {
      try {
        const value = JSON.parse(localStorage.getItem(RUN_STORAGE_KEY));
        return value && Array.isArray(value.jobs) ? value : newTemporaryRun();
      } catch (_) { return newTemporaryRun(); }
    }

    function loadLongTerm() {
      try {
        const value = JSON.parse(localStorage.getItem(LONG_TERM_STORAGE_KEY));
        return value && value.interested && value.notInterested && value.trash ? value : emptyLongTerm();
      } catch (_) { return emptyLongTerm(); }
    }

    function saveTemporaryRun() { localStorage.setItem(RUN_STORAGE_KEY, JSON.stringify(temporaryRun)); }
    function saveLongTerm() { localStorage.setItem(LONG_TERM_STORAGE_KEY, JSON.stringify(longTerm)); }
    function jobs() { return temporaryRun.jobs; }
    function announce(text) { document.getElementById('announcer').textContent = text; }
    function el(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; }
    function add(parent, ...children) { children.flat().filter(Boolean).forEach(child => parent.append(child)); return parent; }
    function button(text, className, handler, action) { const node = el('button', className, text); node.type = 'button'; if (action) node.dataset.action = action; node.addEventListener('click', handler); return node; }
    function label(zone) { return (VIEWS.find(item => item[0] === zone) || ['',zone])[1]; }
    function findJob(id) { return jobs().find(job => job.id === id); }

    // 用户操作历史永久追加，恢复或解除排除不会删除以前的“不感兴趣”事件。
    function logAction(type, job) {
      longTerm.userActions.unshift({type, jobId: job.id, title: job.title, at: now()});
    }

    function isExcluded(id) { return Boolean(longTerm.notInterested[id] || longTerm.trash[id]); }
    function allPendingJobs() { return jobs().filter(job => job.zone === 'pending'); }

    function jobsFor(zone) {
      if (zone === 'interested') return Object.values(longTerm.interested).filter(job => !isExcluded(job.id));
      if (zone === 'trash') return Object.values(longTerm.trash).map(record => ({...record.snapshot, previousZone: record.previousZone}));
      return jobs().filter(job => job.zone === zone && !isExcluded(job.id));
    }

    function count(zone) { return jobsFor(zone).length; }
    function setView(zone) { currentView = zone; render(); }
    function toggleFilters() { filtersOpen = !filtersOpen; render(); }

    function markInterested(job) {
      delete longTerm.notInterested[job.id];
      longTerm.interested[job.id] = copy(job);
      logAction('感兴趣', job);
      saveLongTerm();
      announce(`${job.title}已标记感兴趣`);
      render();
    }

    function markNotInterested(job) {
      delete longTerm.interested[job.id];
      longTerm.notInterested[job.id] = copy(job);
      logAction('不感兴趣', job);
      saveLongTerm();
      announce(`${job.title}已从当前结果隐藏`);
      render();
    }

    // 恢复会清除当前展示排除；历史事件仍在 userActions 中可查询。
    function moveToTrash(job) {
      longTerm.trash[job.id] = {snapshot:copy(job), previousZone:job.zone, movedAt:now()};
      delete longTerm.notInterested[job.id];
      logAction('移入垃圾桶', job);
      saveLongTerm();
      announce(`${job.title}已移入垃圾桶`);
      render();
    }

    function restoreJob(id) {
      const record = longTerm.trash[id];
      if (!record) return;
      delete longTerm.trash[id];
      delete longTerm.notInterested[id];
      if (!findJob(id)) jobs().push({...copy(record.snapshot), zone:record.previousZone});
      logAction('从垃圾桶恢复', record.snapshot);
      saveTemporaryRun();
      saveLongTerm();
      announce(`${record.snapshot.title}已恢复到${label(record.previousZone)}`);
      render();
    }

    function showNotInterested(id) {
      const job = longTerm.notInterested[id];
      if (!job) return;
      delete longTerm.notInterested[id];
      logAction('解除不感兴趣展示排除', job);
      saveLongTerm();
      render();
    }

    function retryJob(id) {
      const job = findJob(id);
      if (!job || job.zone !== 'pending' || !job.retryable) return;
      job.attempts += 1;
      if (job.retryOutcome === 'matched') {
        job.zone = 'matched';
        delete job.failure; delete job.stage; delete job.lastFailedAt;
      } else {
        job.failure = 'AI 核验仍超时';
        job.lastFailedAt = now();
      }
      saveTemporaryRun();
      render();
    }

    function retryAll() { jobsFor('pending').filter(job => job.retryable).forEach(job => retryJob(job.id)); }

    function manualRoute(id, zone) {
      const job = findJob(id);
      if (!job || job.zone !== 'pending') return;
      job.zone = zone;
      delete job.failure; delete job.stage; delete job.lastFailedAt;
      saveTemporaryRun();
      render();
    }

    // 清理前扫描全部临时 jobs，不受垃圾桶或不感兴趣的当前展示状态影响。
    function simulateCleanup() {
      cleanupPrompt = allPendingJobs().length > 0;
      if (!cleanupPrompt) runCleanup(); else render();
    }

    function runCleanup() {
      const pendingRemoved = allPendingJobs().length;
      const totalRemoved = jobs().length;
      temporaryRun = {createdAt: now(), jobs: []};
      longTerm.cleanupRecords.unshift({at:now(), scope:'临时运行结果与待核验记录', succeeded:totalRemoved, failed:0, pendingRemoved});
      saveTemporaryRun();
      saveLongTerm();
      cleanupPrompt = false;
      announce(`已清理 ${totalRemoved} 条临时结果，其中待核验 ${pendingRemoved} 条`);
      render();
    }

    function resetPrototype() {
      temporaryRun = newTemporaryRun();
      longTerm = emptyLongTerm();
      saveTemporaryRun(); saveLongTerm();
      currentView = 'matched'; cleanupPrompt = false; historyOpen = false;
      render();
    }

    function createSidebar() {
      const panel = el('aside', 'sidebar');
      add(panel,
        button('关闭筛选面板', 'mobile-close', toggleFilters),
        el('div', 'brand', 'BOSS 筛选工作台'),
        el('p', 'note', '模拟数据 · 不连接真实后端'),
      );
      const filters = add(
        el('section', 'side-section'),
        el('div', 'side-title', '当前筛选（模拟）'),
      );
      [['薪资','25-45K'],['学历','本科'],['方向','Python 后端']].forEach(([name,value]) => {
        filters.append(add(
          el('div', 'filter-value'),
          el('span', '', name),
          el('strong', '', value),
        ));
      });
      const recordSummary = `感兴趣 ${Object.keys(longTerm.interested).length} · ` +
        `不感兴趣 ${Object.keys(longTerm.notInterested).length} · ` +
        `垃圾桶 ${Object.keys(longTerm.trash).length}`;
      const records = add(
        el('section', 'side-section'),
        el('div', 'side-title', '长期记录'),
        el('div', 'history-line', recordSummary),
        button('查看不感兴趣与全部历史', 'quiet', () => {
          historyOpen = true;
          render();
        }, 'history'),
      );
      const cleanup = add(
        el('section', 'side-section'),
        el('div', 'side-title', '模拟 31 天清理'),
        el('p', 'note', `临时运行创建于：${temporaryRun.createdAt}`),
        button('模拟 31 天后清理', 'quiet', simulateCleanup, 'simulate-cleanup'),
      );
      const last = longTerm.cleanupRecords[0];
      if (last) cleanup.append(el('div', 'history-line', `上次清理：${last.succeeded} 条，待核验 ${last.pendingRemoved} 条`));
      const reset = add(
        el('section', 'side-section'),
        button('重置模拟数据', 'quiet', resetPrototype),
      );
      return add(panel, filters, records, cleanup, reset);
    }

    function createJobRow(job) {
      const row = el('article', 'job');
      row.dataset.jobId = job.id;
      const identity = add(
        el('div'),
        el('div', 'title', job.title),
        el('div', 'company', job.company),
      );
      const meta = add(
        el('div', 'meta'),
        el('span', 'salary', job.salary),
        el('span', '', job.location),
        el('span', '', job.experience),
        el('span', '', job.degree),
      );
      const details = add(el('div'), meta, el('div', 'excerpt', job.jd));
      const actions = el('div', 'actions');
      if (currentView === 'trash') {
        add(actions, el('span', 'failure', `将恢复到：${label(job.previousZone)}`), button('恢复', 'primary', () => restoreJob(job.id), 'restore'));
      } else if (job.zone === 'pending') {
        const retryState = job.retryable ? '可重试' : '无法自动重试';
        actions.append(el('span', 'failure', `${job.failure} · 最近失败：${job.lastFailedAt} · ${retryState}`));
        if (job.retryable) actions.append(button('重试', 'primary', () => retryJob(job.id), 'retry'));
        add(actions,
          button('人工：符合', '', () => manualRoute(job.id, 'matched')),
          button('人工：不符合', '', () => manualRoute(job.id, 'rejected')),
          button('不感兴趣', '', () => markNotInterested(job), 'not-interested'),
          button('移入垃圾桶', 'danger', () => moveToTrash(job), 'trash'),
        );
      } else {
        add(actions,
          button('感兴趣', '', () => markInterested(job), 'interested'),
          button('不感兴趣', '', () => markNotInterested(job), 'not-interested'),
          button('移入垃圾桶', 'danger', () => moveToTrash(job), 'trash'),
        );
      }
      return add(row, identity, details, actions);
    }

    function createWorkspace() {
      const main = el('main', 'main');
      const badges = add(
        el('div', 'topline'),
        el('span', 'badge ok', 'BOSS：未连接（模拟）'),
        el('span', 'badge warn', `待核验 ${allPendingJobs().length}`),
      );
      const header = add(
        el('div', 'topline'),
        el('h1', '', '紧凑清单'),
        button('筛选条件', 'mobile-filter-toggle', toggleFilters),
        badges,
      );
      const summary = add(
        el('section', 'summary'),
        el('strong', '', '运行 #DEMO-023'),
        el('span', '', `临时岗位 ${jobs().length}`),
        el('span', '', `创建于 ${temporaryRun.createdAt}`),
        el('span', '', `待核验 ${allPendingJobs().length}`),
        el('span', 'parse', '字段解析失败 3 / 18（16.7%）'),
      );
      const nav = el('nav', 'views');
      VIEWS.forEach(([zone,text]) => {
        const className = `view-button ${zone === currentView ? 'active' : ''}`;
        const tab = button(text, className, () => setView(zone));
        tab.append(el('span', 'count', String(count(zone))));
        nav.append(tab);
      });
      const jobsInView = jobsFor(currentView);
      const hint = currentView === 'pending'
        ? '本次运行：待处理异常岗位。'
        : '本次运行与长期记录分开保存。';
      const toolbar = add(el('div', 'toolbar'), el('p', '', hint));
      if (currentView === 'pending' && jobsInView.some(job => job.retryable)) toolbar.append(button(`批量重试（${jobsInView.filter(job => job.retryable).length}）`, 'primary', retryAll, 'retry-all'));
      const list = el('section', 'list');
      if (jobsInView.length) jobsInView.forEach(job => list.append(createJobRow(job)));
      else list.append(el('div', 'empty', `${label(currentView)}暂无岗位。`));
      if (cleanupPrompt) {
        main.append(add(
          el('div', 'prompt'),
          el('span', '', `有 ${allPendingJobs().length} 条待核验岗位，清理后不能重试。`),
          button('仍要清理', 'danger', runCleanup, 'confirm-cleanup'),
          button('取消', '', () => { cleanupPrompt = false; render(); }),
        ));
      }
      return add(main, header, summary, nav, toolbar, list);
    }

    function createHistoryModal() {
      const root = document.getElementById('modalRoot');
      root.replaceChildren();
      if (!historyOpen) return;
      const box = add(el('section', 'modal'), el('h2', '', '不感兴趣与全部操作历史'));
      const active = Object.values(longTerm.notInterested);
      box.append(el('h3', '', '当前不感兴趣'));
      if (!active.length) box.append(el('p', 'note', '暂无当前展示排除。'));
      active.forEach(job => {
        const description = add(
          el('div'),
          el('strong', '', job.title),
          el('div', 'history-line', `原区域：${label(job.zone)}`),
        );
        const actions = add(
          el('div', 'modal-actions'),
          button('移入垃圾桶', 'danger', () => moveToTrash(job), 'history-to-trash'),
          button('重新显示', '', () => showNotInterested(job.id)),
        );
        box.append(add(el('div', 'modal-row'), description, actions));
      });
      box.append(el('h3', '', '全部操作历史'));
      longTerm.userActions.forEach(action => box.append(el('div', 'history-line', `${action.at} · ${action.type} · ${action.title}`)));
      box.append(button('关闭', 'quiet', () => { historyOpen = false; render(); }));
      root.append(add(el('div', 'modal-backdrop open'), box));
    }

    function render() {
      document.body.classList.toggle('filters-open', filtersOpen);
      const app = add(el('div', 'app'), createSidebar(), createWorkspace());
      document.getElementById('root').replaceChildren(app, button('关闭筛选面板', 'drawer-backdrop', toggleFilters));
      createHistoryModal();
    }

    // 首次打开也立即落盘临时运行记录，而不是等用户第一次操作。
    saveTemporaryRun();
    saveLongTerm();
