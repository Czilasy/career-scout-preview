<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 求职工作台 · v2</title>
  <style>
    :root, html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0a0a0a;
      --surface: #111111;
      --surface-2: #171717;
      --surface-3: #1f1f1f;
      --line: rgba(255,255,255,.10);
      --line-2: rgba(255,255,255,.22);
      --line-3: rgba(255,255,255,.42);
      --text: #fafafa;
      --muted: #9a9a9a;
      --faint: #5c5c5c;
      --invert-bg: #fafafa;
      --invert-fg: #0a0a0a;
      --ok: #4ade80;
      --no: #f87171;
      --radius: 10px;
      --radius-s: 6px;
      --header-h: 56px;
      --sans: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #fafafa;
      --surface: #ffffff;
      --surface-2: #f2f2f2;
      --surface-3: #e9e9e9;
      --line: rgba(0,0,0,.12);
      --line-2: rgba(0,0,0,.26);
      --line-3: rgba(0,0,0,.5);
      --text: #0a0a0a;
      --muted: #6a6a6a;
      --faint: #9a9a9a;
      --invert-bg: #0a0a0a;
      --invert-fg: #fafafa;
      --ok: #16a34a;
      --no: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; font-family: var(--sans); }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: none; background: none; }
    a { color: var(--text); text-decoration: none; }
    .mono { font-family: var(--mono); }

    /* == 顶栏 == */
    .app-header {
      height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; border-bottom: 1px solid var(--line); background: var(--surface);
      position: sticky; top: 0; z-index: 100;
    }
    .brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 10px; letter-spacing: .01em; }
    .brand .logo {
      width: 26px; height: 26px; border-radius: 5px; background: var(--invert-bg); color: var(--invert-fg);
      display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; font-weight: 700;
    }
    .brand .vt { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--faint); border: 1px solid var(--line-2); padding: 1px 5px; border-radius: 4px; }
    .header-actions { display: flex; align-items: center; gap: 12px; }
    .stats { display: flex; gap: 8px; }
    .stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
    .stat .n { font-family: var(--mono); font-size: 15px; font-weight: 700; letter-spacing: -.02em; }
    .stat .l { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; color: var(--faint); text-transform: uppercase; }
    .conn-status {
      font-family: var(--mono); font-size: 11px; letter-spacing: .04em; color: var(--muted);
      display: flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); padding: 4px 10px; border-radius: 999px;
    }
    .conn-status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
    .conn-status.ok { color: var(--text); }
    .conn-status.ok::before { background: var(--ok); }
    .conn-status.bad { color: var(--text); }
    .conn-status.bad::before { background: var(--no); }
    .theme-toggle {
      border: 1px solid var(--line-2); background: transparent; color: var(--text);
      width: 32px; height: 32px; border-radius: var(--radius-s); display: flex; align-items: center; justify-content: center;
    }
    .theme-toggle:hover { border-color: var(--line-3); }
    .theme-toggle svg { width: 15px; height: 15px; }

    .workspace { display: flex; height: calc(100vh - var(--header-h)); overflow: hidden; }

    /* == 左侧设置区 == */
    .settings-panel {
      width: 320px; min-width: 320px; border-right: 1px solid var(--line);
      background: var(--surface); overflow-y: auto; transition: margin-left .25s ease, min-width .25s ease, width .25s ease;
    }
    .settings-panel.collapsed { margin-left: -320px; min-width: 0; width: 0; }
    .settings-toggle {
      position: absolute; left: 320px; top: calc(var(--header-h) + 10px); z-index: 50;
      width: 24px; height: 48px; border: 1px solid var(--line); border-left: none;
      border-radius: 0 6px 6px 0; background: var(--surface); color: var(--muted);
      display: flex; align-items: center; justify-content: center; font-size: 14px; transition: left .25s ease;
    }
    .settings-toggle.collapsed { left: 0; }
    .settings-toggle:hover { color: var(--text); border-color: var(--line-3); }

    .section { padding: 16px; border-bottom: 1px solid var(--line); }
    .section-title { font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .14em; margin-bottom: 12px; }
    .field { margin-bottom: 11px; }
    .field label { display: block; font-family: var(--mono); font-size: 10px; color: var(--muted); margin-bottom: 5px; letter-spacing: .06em; text-transform: uppercase; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 8px 10px; border: 1px solid var(--line-2); border-radius: var(--radius-s);
      background: var(--bg); outline: none; transition: border-color .15s; font-family: var(--mono); font-size: 12.5px;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--line-3); }
    .field input[type="file"] { padding: 5px; font-family: var(--sans); font-size: 12px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      padding: 8px 14px; border: 1px solid var(--line-2); border-radius: var(--radius-s); background: transparent;
      color: var(--text); font-size: 13px; font-weight: 600; transition: border-color .15s, opacity .15s;
    }
    .btn svg { width: 15px; height: 15px; }
    .btn:hover { border-color: var(--line-3); }
    .btn.primary { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
    .btn.primary:hover { opacity: .85; }
    .btn.danger { color: var(--text); border-color: var(--line-2); }
    .btn.danger:hover { border-color: var(--no); color: var(--no); }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn-row .btn { flex: 1; }

    .history-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; font-family: var(--mono); font-size: 11px; }
    .history-item { padding: 7px 10px; border-radius: var(--radius-s); background: var(--bg); cursor: pointer; transition: background .12s; color: var(--muted); }
    .history-item:hover { background: var(--surface-2); color: var(--text); }

    /* == 主区 == */
    .main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .search-bar {
      padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--surface);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .search-info { font-size: 13px; color: var(--muted); }
    .search-info strong { color: var(--text); font-family: var(--mono); }
    .search-actions { display: flex; gap: 8px; }

    .job-card-list {
      flex: 1; overflow-y: auto; padding: 18px 20px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 14px; align-content: start;
    }
    .empty-state { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 70px 20px; border: 1px dashed var(--line-2); border-radius: var(--radius); }
    .empty-state .em-ic { width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 10px; border: 1px solid var(--line-2); display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 20px; color: var(--text); }
    .empty-state h4 { color: var(--text); font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .empty-state p { font-family: var(--mono); font-size: 11.5px; line-height: 1.8; }

    /* == 岗位卡片 == */
    .job-card {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 15px; display: flex; flex-direction: column; gap: 9px; min-height: 0;
      transition: border-color .15s ease, opacity .3s ease, transform .3s ease;
      animation: cardEnter .3s ease-out;
    }
    .job-card:hover { border-color: var(--line-2); }
    .job-card.exiting { opacity: 0; transform: translateY(8px); }
    @keyframes cardEnter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
    .card-title-block { min-width: 0; flex: 1; }
    .card-title { font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-company { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 3px; letter-spacing: .02em; }
    .card-salary { font-family: var(--mono); font-size: 14px; font-weight: 700; white-space: nowrap; }
    .card-meta { font-family: var(--mono); font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .card-jd {
      font-size: 12.5px; color: var(--muted); flex: 1; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; line-height: 1.55;
    }
    .card-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .card-link {
      font-size: 12.5px; color: var(--text); padding: 5px 12px;
      border: 1px solid var(--line-2); border-radius: var(--radius-s); transition: border-color .12s; display: inline-flex; align-items: center; gap: 6px;
    }
    .card-link svg { width: 13px; height: 13px; }
    .card-link:hover { border-color: var(--line-3); }
    .card-btn {
      padding: 5px 12px; border: 1px solid var(--line-2); border-radius: var(--radius-s); font-size: 12.5px; font-weight: 600;
      transition: border-color .12s, color .12s; display: inline-flex; align-items: center; gap: 6px;
    }
    .card-btn svg { width: 13px; height: 13px; }
    .card-btn:hover { border-color: var(--line-3); }
    .card-btn.primary { background: var(--invert-bg); color: var(--invert-fg); border-color: var(--invert-bg); }
    .card-btn.primary:hover { opacity: .85; }
    .card-btn.interested { color: var(--muted); border-color: var(--line-2); background: transparent; cursor: default; }
    .card-btn.more { font-family: var(--mono); font-size: 11.5px; }
    .more-row { display: none; gap: 8px; align-items: center; flex-wrap: wrap; padding-top: 2px; border-top: 1px dashed var(--line); margin-top: 2px; padding-top: 9px; }
    .more-row.open { display: flex; }
    .more-row select { padding: 5px 8px; border: 1px solid var(--line-2); border-radius: var(--radius-s); background: var(--bg); font-family: var(--mono); font-size: 11.5px; }
    .more-row .card-btn.not-interested:hover { border-color: var(--no); color: var(--no); }
    .more-row .card-btn.remove:hover { border-color: var(--no); color: var(--no); }

    .badge { font-family: var(--mono); font-size: 10.5px; font-weight: 700; background: var(--invert-bg); color: var(--invert-fg); padding: 2px 7px; border-radius: 4px; white-space: nowrap; letter-spacing: .03em; }
    .pill-tag { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; border: 1px solid var(--line-2); color: var(--muted); padding: 1px 7px; border-radius: 999px; }

    .undo-bar {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: var(--surface-2); border: 1px solid var(--line-3); border-radius: var(--radius-s);
      padding: 10px 16px; display: none; align-items: center; gap: 12px; z-index: 200;
    }
    .undo-bar.show { display: flex; animation: cardEnter .2s ease-out; }
    .undo-bar .btn { padding: 4px 12px; font-size: 12px; }

    .ai-suggestion { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .ai-suggestion .field-group { margin-bottom: 6px; font-family: var(--mono); }
    .ai-suggestion .field-group span { color: var(--text); }
    .suggestion-box { background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-s); padding: 10px; margin-top: 6px; }

    /* 骨架屏 */
    .skeleton { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 15px; display: flex; flex-direction: column; gap: 9px; }
    .sk { background: var(--surface-3); border-radius: 4px; }
    .sk.ln { height: 10px; }
    .sk.ln.s { width: 40%; } .sk.ln.m { width: 70%; }
    .sk.box { height: 54px; margin-top: 4px; }
    @keyframes shimmer { 0% { opacity: .5; } 50% { opacity: 1; } 100% { opacity: .5; } }
    .sk { animation: shimmer 1.3s infinite; }

    .consent-note { font-size: 11.5px; color: var(--muted); line-height: 1.6; }
    .consent-note label { display: flex; align-items: center; gap: 6px; font-family: var(--sans); text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 11.5px; margin-top: 6px; cursor: pointer; }

    @media (max-width: 720px) {
      .settings-panel { position: fixed; left: 0; top: var(--header-h); height: calc(100vh - var(--header-h)); z-index: 90; box-shadow: 2px 0 12px rgba(0,0,0,.3); }
      .settings-panel.collapsed { margin-left: -320px; }
      .settings-toggle { left: 320px; }
      .settings-toggle.collapsed { left: 0; }
      .stats { display: none; }
      .job-card-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="app-header">
    <div class="brand"><span class="logo">AI</span>AI 求职工作台 <span class="vt">V2</span></div>
    <div class="header-actions">
      <div class="stats">
        <div class="stat"><span class="n" id="statFound">0</span><span class="l">FOUND</span></div>
        <div class="stat"><span class="n" id="statLike">0</span><span class="l">LIKE</span></div>
        <div class="stat"><span class="n" id="statSent">0</span><span class="l">SENT</span></div>
      </div>
      <span class="conn-status" id="connectionStatus">未连接</span>
      <button class="theme-toggle" onclick="toggleTheme()" aria-label="切换深/浅色">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </div>

  <div class="workspace">
    <button class="settings-toggle" id="settingsToggle" onclick="toggleSettings()" aria-label="折叠设置区">◀</button>

    <aside class="settings-panel" id="settingsPanel">
      <div class="section">
        <div class="section-title">画像管理</div>
        <div class="field">
          <select id="profileSelect" onchange="selectProfile(this.value)"></select>
        </div>
        <div class="field">
          <label>画像名称</label>
          <input type="text" id="profileName" placeholder="如：Python 后端求职">
        </div>
        <div class="field">
          <label>城市</label>
          <input type="text" id="profileCity" placeholder="如：上海">
        </div>
        <div class="field">
          <label>岗位方向（逗号分隔）</label>
          <input type="text" id="profileRoles" placeholder="如：Python 后端,FastAPI">
        </div>
        <div class="field">
          <label>最低薪资（K）</label>
          <input type="number" id="profileMinSalary" placeholder="如：20">
        </div>
        <div class="field"><label>行业代码（可选）</label><input type="text" id="profileIndustry" placeholder="BOSS 行业代码"></div>
        <div class="field"><label>排除关键词（逗号分隔）</label><input type="text" id="profileExcludes" placeholder="如：外包,销售"></div>
        <div class="btn-row">
          <button class="btn primary" onclick="createProfile()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>创建画像
          </button>
          <button class="btn" onclick="saveProfileFields()">保存条件</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">简历上传</div>
        <div class="field">
          <input type="file" id="resumeFile" accept=".txt,.pdf,.docx">
        </div>
        <div class="consent-note">
          勾选后，简历文本会发送到你配置的 AI 服务用于生成可编辑建议；不勾选则只本地保存。
          <label><input type="checkbox" id="resumeAiConsent"> 我已知悉并同意 AI 解析</label>
        </div>
        <div class="btn-row">
          <button class="btn primary" onclick="uploadResume()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>上传解析
          </button>
        </div>
        <div id="aiSuggestion" class="ai-suggestion" style="display:none;"></div>
      </div>

      <div class="section">
        <div class="section-title">AI 服务设置</div>
        <div class="field">
          <label>AI 服务 URL</label>
          <input type="url" id="aiEndpointUrl" placeholder="https://api.example.com/v1">
        </div>
        <div class="field">
          <label>API Key</label>
          <input type="password" id="aiApiKey" placeholder="sk-...">
        </div>
        <div class="btn-row">
          <button class="btn primary" onclick="saveAiSettings()">保存</button>
          <button class="btn" onclick="testAiConnection()">测试</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">搜索</div>
        <div class="field">
          <label>手动关键词（逗号分隔，最多3个）</label>
          <input type="text" id="manualKeywords" placeholder="如：Python 后端,FastAPI,风控">
        </div>
        <div class="btn-row">
          <button class="btn primary" onclick="startSearch()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4-4"/></svg>开始搜索
          </button>
          <button class="btn danger" onclick="cancelSearch()" id="cancelBtn" style="display:none;">取消</button>
        </div>
      </div>

      <div class="section">
        <div class="section-title">搜索历史</div>
        <div class="btn-row">
          <button class="btn" onclick="loadHistory('interested')">感兴趣</button>
          <button class="btn" onclick="loadHistory('applied')">已投递</button>
          <button class="btn" onclick="loadHistory('new')">历史</button>
        </div>
        <div class="history-list" id="historyList"></div>
      </div>
    </aside>

    <main class="main-area">
      <div class="search-bar">
        <div class="search-info" id="searchInfo">点击搜索开始发现岗位</div>
        <div class="search-actions" id="searchActions"></div>
      </div>
      <div class="job-card-list" id="jobCardList">
        <div class="empty-state">
          <div class="em-ic">∅</div>
          <h4>还没有岗位</h4>
          <p>上传简历或输入关键词，点 [开始搜索]<br>让 AI 帮你发现匹配的职位</p>
        </div>
      </div>
    </main>
  </div>

  <div class="undo-bar" id="undoBar">
    <span id="undoText">已标记不感兴趣</span>
    <button class="btn primary" onclick="undoLastFeedback()">撤销</button>
  </div>

  <script>
    let token = "";
    let currentProfileId = "";
    let currentRunId = "";
    let lastFeedbackJobId = "";
    let lastFeedbackId = "";
    let pollTimer = null;
    const API = {
      session: "/api/session",
      profiles: "/api/profiles",
      aiSettings: "/api/ai-settings",
      searchRuns: "/api/search-runs",
      profileJobs: "/api/profile-jobs",
    };

    async function api(path, opts = {}) {
      const headers = { "X-Boss-Token": token, ...opts.headers };
      if (opts.json) { headers["Content-Type"] = "application/json"; opts.body = JSON.stringify(opts.json); }
      const resp = await fetch(path, { ...opts, headers });
      if (resp.status === 403) { alert("会话已过期，请刷新页面"); throw new Error("forbidden"); }
      return resp;
    }

    async function init() {
      const resp = await fetch(API.session);
      const data = await resp.json();
      token = data.token;
      await loadProfiles();
      await loadAiSettings();
      await checkConnection();
      await restoreSearchRun();
      await updateStats();
    }

    async function checkConnection() {
      try {
        const resp = await fetch("/api/check");
        const data = await resp.json();
        const el = document.getElementById("connectionStatus");
        el.className = "conn-status " + (data.connected ? "ok" : "bad");
        el.textContent = data.connected ? "已连接" : "未连接";
      } catch(e) { document.getElementById("connectionStatus").className = "conn-status bad"; }
    }

    function toggleSettings() {
      const panel = document.getElementById("settingsPanel");
      const toggle = document.getElementById("settingsToggle");
      panel.classList.toggle("collapsed");
      toggle.classList.toggle("collapsed");
      toggle.textContent = panel.classList.contains("collapsed") ? "▶" : "◀";
    }

    function toggleTheme() {
      const h = document.documentElement;
      if (h.getAttribute("data-theme") === "light") h.removeAttribute("data-theme");
      else h.setAttribute("data-theme", "light");
    }

    // == 画像 ==
    async function loadProfiles() {
      const resp = await api(API.profiles);
      const data = await resp.json();
      const sel = document.getElementById("profileSelect");
      sel.innerHTML = "";
      for (const p of data.profiles) {
        const opt = document.createElement("option");
        opt.value = p.id; opt.textContent = p.name;
        sel.appendChild(opt);
      }
      if (data.profiles.length > 0) {
        const selected = data.profiles.some(p => p.id === currentProfileId) ? currentProfileId : data.profiles[0].id;
        selectProfile(selected);
      }
    }

    function selectProfile(pid) {
      currentProfileId = pid;
      document.getElementById("profileSelect").value = pid;
      updateStats();
    }

    async function createProfile() {
      const name = document.getElementById("profileName").value.trim();
      if (!name) { alert("请输入画像名称"); return; }
      const fields = collectProfileFields();
      const resp = await api(API.profiles, { method: "POST", json: { name, confirmed_fields: fields } });
      if (resp.ok) { await loadProfiles(); await updateStats(); }
    }

    function collectProfileFields() {
      const fields = {};
      const city = document.getElementById("profileCity").value.trim();
      const roles = document.getElementById("profileRoles").value.trim();
      const minSalary = document.getElementById("profileMinSalary").value.trim();
      const industry = document.getElementById("profileIndustry").value.trim();
      const excludes = document.getElementById("profileExcludes").value.trim();
      if (city) fields.city = city;
      if (roles) fields.roles = roles.split(",").map(s => s.trim()).filter(Boolean);
      if (minSalary) fields.min_salary = parseFloat(minSalary);
      if (industry) fields.industry = industry;
      if (excludes) fields.excluded_terms = excludes.split(",").map(s => s.trim()).filter(Boolean);
      return fields;
    }

    async function saveProfileFields() {
      if (!currentProfileId) { alert("请先选择画像"); return; }
      const fields = collectProfileFields();
      await api(`${API.profiles}/${currentProfileId}`, { method: "PATCH", json: { confirmed_fields: fields } });
    }

    // == 简历 ==
    async function uploadResume() {
      if (!currentProfileId) { alert("请先选择画像"); return; }
      const fileInput = document.getElementById("resumeFile");
      if (!fileInput.files.length) { alert("请选择简历文件"); return; }
      const formData = new FormData();
      formData.append("file", fileInput.files[0]);
      formData.append("ai_consent", String(document.getElementById("resumeAiConsent").checked));
      const resp = await fetch(`/api/profiles/${currentProfileId}/resume`, {
        method: "POST", body: formData, headers: { "X-Boss-Token": token },
      });
      if (resp.ok) {
        const data = await resp.json();
        if (data.profile_id && data.profile_id !== currentProfileId) {
          currentProfileId = data.profile_id;
          await loadProfiles();
        }
        showAiSuggestion(data);
      } else {
        const err = await resp.json().catch(() => ({}));
        alert("上传失败: " + (err.error || resp.status));
      }
    }

    function showAiSuggestion(data) {
      const el = document.getElementById("aiSuggestion");
      el.style.display = "block";
      const sug = data.ai_suggestion || {};
      const box = document.createElement("div");
      box.className = "suggestion-box";
      const addLine = (label, value) => {
        const row = document.createElement("div"); row.className = "field-group";
        const span = document.createElement("span"); span.textContent = value || "—";
        row.append(`${label}：`, span); box.appendChild(row);
      };
      if (sug.error) { box.textContent = sug.error; el.replaceChildren(box); return; }
      addLine("AI 解析城市", sug.city);
      addLine("岗位方向", (sug.roles || []).join("、"));
      addLine("技能", (sug.skills || []).join("、"));
      addLine("搜索关键词", (sug.keywords || []).join("、"));
      const notice = document.createElement("div");
      notice.style.cssText = "margin-top:6px;font-size:11px;color:var(--muted);";
      notice.textContent = data.privacy_notice || ""; box.appendChild(notice);
      el.replaceChildren(box);
      if (sug.city) document.getElementById("profileCity").value = sug.city;
      if (sug.roles) document.getElementById("profileRoles").value = sug.roles.join(",");
    }

    // == AI 设置 ==
    async function loadAiSettings() {
      const resp = await api(API.aiSettings);
      const data = await resp.json();
      document.getElementById("aiEndpointUrl").value = data.endpoint_url || "";
    }

    async function saveAiSettings() {
      const endpoint_url = document.getElementById("aiEndpointUrl").value.trim();
      const api_key = document.getElementById("aiApiKey").value.trim();
      if (!endpoint_url || !api_key) { alert("请填写 URL 和 Key"); return; }
      const resp = await api(API.aiSettings, { method: "PUT", json: { endpoint_url, api_key } });
      if (resp.ok) { document.getElementById("aiApiKey").value = ""; alert("已保存，Key 已进入系统凭据库"); }
    }

    async function testAiConnection() {
      const resp = await api("/api/ai-settings/test", { method: "POST" });
      const data = await resp.json();
      alert(data.ok ? "连接成功" : "连接失败: " + (data.error_code || "未知"));
    }

    // == 搜索 ==
    function showSkeletons(n = 3) {
      const list = document.getElementById("jobCardList");
      list.innerHTML = "";
      for (let i = 0; i < n; i++) {
        const sk = document.createElement("div");
        sk.className = "skeleton";
        sk.innerHTML = '<div class="sk ln m"></div><div class="sk ln s"></div><div class="sk box"></div>';
        list.appendChild(sk);
      }
    }

    async function startSearch() {
      if (!currentProfileId) { alert("请先选择画像"); return; }
      const kw = document.getElementById("manualKeywords").value.trim();
      const keywords = kw ? kw.split(",").map(s => s.trim()).filter(Boolean) : [];
      const body = { profile_id: currentProfileId };
      if (keywords.length) body.manual_keywords = keywords;
      try {
        const resp = await api(API.searchRuns, { method: "POST", json: body });
        if (resp.status === 400) { const e = await resp.json(); alert(e.error); return; }
        const run = await resp.json();
        currentRunId = run.id;
        localStorage.setItem("boss-workbench-run", run.id);
        document.getElementById("cancelBtn").style.display = "inline-block";
        document.getElementById("searchInfo").innerHTML = `搜索运行中… <strong>${run.total_detail_budget}</strong> 条预算`;
        showSkeletons();
        startPolling(run.id);
        loadHistory();
      } catch(e) { /* handled */ }
    }

    async function cancelSearch() {
      if (!currentRunId) return;
      await api(`${API.searchRuns}/${currentRunId}/cancel`, { method: "POST" });
      stopPolling();
      document.getElementById("cancelBtn").style.display = "none";
    }

    function startPolling(runId) {
      stopPolling();
      pollTimer = setInterval(async () => {
        try {
          const resp = await api(`${API.searchRuns}/${runId}/jobs`);
          const data = await resp.json();
          renderCards(data.jobs || []);
          const runResp = await api(`${API.searchRuns}/${runId}`);
          const run = await runResp.json();
          document.getElementById("searchInfo").innerHTML =
            `状态：<strong>${run.status}</strong> · 已发现 <strong>${run.discovered_count || 0}</strong> · 已完成 <strong>${run.completed_jd_count || 0}</strong>`;
          document.getElementById("statFound").textContent = run.discovered_count || 0;
          if (["succeeded","partial","failed","interrupted"].includes(run.status)) {
            stopPolling();
            localStorage.removeItem("boss-workbench-run");
            document.getElementById("cancelBtn").style.display = "none";
          }
        } catch(e) {}
      }, 2000);
    }

    function stopPolling() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }

    async function restoreSearchRun() {
      const runId = localStorage.getItem("boss-workbench-run");
      if (!runId) return;
      try {
        const response = await api(`${API.searchRuns}/${runId}`);
        if (!response.ok) { localStorage.removeItem("boss-workbench-run"); return; }
        const run = await response.json();
        if (["queued", "running"].includes(run.status)) {
          currentRunId = runId;
          document.getElementById("cancelBtn").style.display = "inline-block";
          startPolling(runId);
        } else {
          localStorage.removeItem("boss-workbench-run");
        }
      } catch (_error) { /* retry on next refresh */ }
    }

    function renderCards(jobs) {
      const list = document.getElementById("jobCardList");
      const existing = new Set(Array.from(list.children).map(c => c.dataset && c.dataset.jobId).filter(Boolean));
      if (jobs.length === 0) {
        if (list.children.length === 0) {
          list.innerHTML = '<div class="empty-state"><div class="em-ic">∅</div><h4>还没有岗位</h4><p>上传简历或输入关键词，点 [开始搜索]<br>让 AI 帮你发现匹配的职位</p></div>';
        }
        return;
      }
      const hadPlaceholder = list.querySelector(".empty-state") || list.querySelector(".skeleton");
      if (hadPlaceholder) list.innerHTML = "";
      let added = 0;
      for (const job of jobs) {
        if (existing.has(job.job_id)) continue;
        const card = createCard(job);
        list.appendChild(card);
        added++;
      }
      if (added) document.getElementById("statFound").textContent = list.querySelectorAll(".job-card").length;
    }

    function createCard(job) {
      const card = document.createElement("div");
      card.className = "job-card";
      card.dataset.jobId = job.job_id;
      const safeUrl = job.canonical_url || "";
      const node = (className, text) => { const el = document.createElement("div"); el.className = className; el.textContent = text; return el; };
      const header = document.createElement("div"); header.className = "card-header";
      const titleBlock = document.createElement("div"); titleBlock.className = "card-title-block";
      titleBlock.append(node("card-title", job.title), node("card-company", job.company));
      const headRight = document.createElement("div");
      headRight.style.display = "flex"; headRight.style.alignItems = "center"; headRight.style.gap = "8px";
      if (job.match_score != null) { const b = document.createElement("span"); b.className = "badge"; b.textContent = "匹配 " + Math.round(job.match_score) + "%"; headRight.appendChild(b); }
      headRight.appendChild(node("card-salary", job.salary));
      header.append(titleBlock, headRight);

      const meta = node("card-meta", job.location);
      if (Array.isArray(job.tags) && job.tags.length) {
        job.tags.forEach(t => { const tag = document.createElement("span"); tag.className = "pill-tag"; tag.textContent = t; meta.appendChild(tag); });
      }
      const jd = node("card-jd", job.jd_excerpt);

      const actions = document.createElement("div"); actions.className = "card-actions";
      const stop = event => event.stopPropagation();
      if (safeUrl) {
        const link = document.createElement("a"); link.className = "card-link"; link.href = safeUrl;
        link.target = "_blank"; link.rel = "noopener noreferrer"; link.textContent = "阅读职位描述";
        link.addEventListener("click", event => openSafe(event, safeUrl)); actions.appendChild(link);
        card.addEventListener("click", event => openSafe(event, safeUrl));
      }
      const interested = document.createElement("button"); interested.type = "button"; interested.className = "card-btn" + (job.interest_state === "interested" ? " interested" : " primary");
      interested.textContent = job.interest_state === "interested" ? "已感兴趣" : "感兴趣";
      interested.addEventListener("click", event => { stop(event); if (job.interest_state !== "interested") markInterested(job.job_id); });
      if (job.interest_state === "interested") {
        const applied = document.createElement("button"); applied.type = "button"; applied.className = "card-btn"; applied.textContent = "标记已投递";
        applied.addEventListener("click", event => { stop(event); setJobStatus(job.job_id, "applied"); });
        actions.appendChild(applied);
      }

      // 更多菜单：不感兴趣原因 + 不感兴趣 + 删除
      const moreBtn = document.createElement("button"); moreBtn.type = "button"; moreBtn.className = "card-btn more"; moreBtn.textContent = "更多 ⋯";
      const moreRow = document.createElement("div"); moreRow.className = "more-row";
      const reason = document.createElement("select");
      [["", "不感兴趣原因（可跳过）"], ["role", "岗位方向"], ["salary", "薪资"], ["location", "地点"], ["company", "公司"]].forEach(([value, label]) => {
        const option = document.createElement("option"); option.value = value; option.textContent = label; reason.appendChild(option);
      });
      const dislike = document.createElement("button"); dislike.type = "button"; dislike.className = "card-btn not-interested"; dislike.textContent = "不感兴趣";
      dislike.addEventListener("click", event => { stop(event); markNotInterested(job.job_id, dislike, reason.value); });
      const remove = document.createElement("button"); remove.type = "button"; remove.className = "card-btn remove"; remove.textContent = "删除";
      remove.addEventListener("click", event => { stop(event); setJobStatus(job.job_id, "deleted"); });
      moreRow.append(reason, dislike, remove);

      moreBtn.addEventListener("click", event => { stop(event); moreRow.classList.toggle("open"); });
      moreRow.addEventListener("click", stop);

      actions.append(interested, moreBtn);
      card.append(header, meta, jd, actions, moreRow);
      return card;
    }

    function openSafe(event, url) {
      event.preventDefault();
      event.stopPropagation();
      try {
        const parsed = new URL(url);
        if (parsed.protocol !== "https:") { return false; }
        const host = parsed.hostname.toLowerCase();
        if (host !== "www.zhipin.com" && host !== "zhipin.com" && !host.endsWith(".zhipin.com")) { return false; }
      } catch(e) { return false; }
      window.open(url, "_blank", "noopener,noreferrer");
      return false;
    }

    async function markInterested(jobId) {
      const resp = await api(`/api/jobs/${jobId}/feedback`, {
        method: "POST", json: { profile_id: currentProfileId, action: "interested" },
      });
      if (resp.ok) { await refreshCards(); await updateStats(); }
    }

    async function setJobStatus(jobId, status) {
      const resp = await api(`${API.profileJobs}/${currentProfileId}/${jobId}`, {
        method: "PATCH", json: { status },
      });
      if (resp.ok) { await refreshCards(); await loadHistory(); await updateStats(); }
    }

    async function markNotInterested(jobId, btn, reason = null) {
      const resp = await api(`/api/jobs/${jobId}/feedback`, {
        method: "POST", json: { profile_id: currentProfileId, action: "not_interested", reason: reason || null },
      });
      if (!resp.ok) return;
      const data = await resp.json();
      lastFeedbackJobId = jobId;
      lastFeedbackId = data.feedback_id;
      const card = btn.closest(".job-card");
      card.classList.add("exiting");
      setTimeout(() => { card.style.display = "none"; }, 300);
      showUndo();
    }

    function showUndo() {
      const bar = document.getElementById("undoBar");
      bar.classList.add("show");
      clearTimeout(window._undoTimer);
      window._undoTimer = setTimeout(() => bar.classList.remove("show"), 5000);
    }

    async function undoLastFeedback() {
      if (!lastFeedbackId) return;
      await api(`/api/feedback/${lastFeedbackId}/revoke`, { method: "POST" });
      document.getElementById("undoBar").classList.remove("show");
      const card = document.querySelector(`.job-card[data-job-id="${lastFeedbackJobId}"]`);
      if (card) { card.classList.remove("exiting"); card.style.display = ""; }
      lastFeedbackId = ""; lastFeedbackJobId = "";
      await updateStats();
    }

    async function refreshCards() {
      if (!currentRunId) return;
      const resp = await api(`${API.searchRuns}/${currentRunId}/jobs`);
      const data = await resp.json();
      document.getElementById("jobCardList").innerHTML = "";
      renderCards(data.jobs || []);
    }

    async function updateStats() {
      if (!currentProfileId) return;
      try {
        const resp = await api(`${API.profileJobs}?profile_id=${currentProfileId}`);
        const data = await resp.json();
        const jobs = data.jobs || [];
        let like = 0, sent = 0;
        for (const pj of jobs) {
          if (pj.status === "interested") like++;
          else if (pj.status === "applied") sent++;
        }
        document.getElementById("statLike").textContent = like;
        document.getElementById("statSent").textContent = sent;
      } catch (e) { /* 非关键，静默 */ }
    }

    async function loadHistory(status = "new") {
      const suffix = status ? `&status=${encodeURIComponent(status)}` : "";
      const resp = await api(`${API.profileJobs}?profile_id=${currentProfileId}${suffix}`);
      const data = await resp.json();
      const list = document.getElementById("historyList");
      list.innerHTML = "";
      const seen = new Set();
      for (const pj of data.jobs) {
        if (seen.has(pj.job_id)) continue;
        seen.add(pj.job_id);
        const item = document.createElement("div");
        item.className = "history-item";
        item.textContent = `${pj.status} · ${new Date(pj.shown_at).toLocaleDateString()}`;
        list.appendChild(item);
      }
      await updateStats();
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text || "");
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
