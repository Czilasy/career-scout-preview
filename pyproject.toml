[project]
name = "career-scout"
version = "2.7.0"
description = "Career Scout — BOSS直聘 & 智联招聘职位助手（Chrome CDP + 简历驱动筛选 + 投递过期提醒）"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
    { name = "Czilasy", email = "czyooutzilas@gmail.com" }
]
keywords = ["career", "zhipin", "boss", "zhilian", "jobs", "cdp", "scraper"]

dependencies = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
    "flask>=3.0.0,<4.0.0",
    "keyring>=24.0.0,<26.0.0",
    "pypdf>=4.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
]

[project.optional-dependencies]
all = [
    "websocket-client>=1.6.0,<2.0.0",
    "requests>=2.28.0,<3.0.0",
]

[project.scripts]
# 模块路径对应 [tool.hatch.build.targets.wheel] 的 packages=["scripts"]，
# 安装后顶层包名为 scripts，故入口是 scripts.boss_cdp_raw:main
career-scout = "scripts.boss_cdp_raw:main"
career-summary = "scripts.job_summary:main"

[project.urls]
Homepage = "https://github.com/Czilasy/career-scout-preview"
Repository = "https://github.com/Czilasy/career-scout-preview"
Issues = "https://github.com/Czilasy/career-scout-preview/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts"]
# 城市码表 data/city_codes.json 打进 wheel，pip install 后也能读到
force-include = { "data/city_codes.json" = "data/city_codes.json" }

[tool.pytest.ini_options]
pythonpath = ["."]
