<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕骑自行车</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #18364c;
      --paper: #fff7e9;
      --sky: #b9e6e2;
      --sun: #ffc96b;
      --coral: #f47b61;
      --teal: #147d82;
      --road: #e7c38f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Noto Serif SC", serif;
    }

    .poster {
      width: min(100vw, 1100px);
      aspect-ratio: 16 / 10;
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: var(--sky);
    }

    .sun {
      position: absolute;
      width: 15%;
      aspect-ratio: 1;
      border-radius: 50%;
      top: 8%;
      right: 11%;
      background: var(--sun);
      box-shadow: 0 0 0 1.2vw rgb(255 247 233 / 28%);
    }

    .cloud { position: absolute; opacity: .8; animation: drift 18s linear infinite; }
    .cloud::before, .cloud::after { content: ""; position: absolute; background: #fff9e8; border-radius: 50%; }
    .cloud::before { width: 72px; height: 38px; left: 0; bottom: 0; }
    .cloud::after { width: 50px; height: 50px; left: 30px; bottom: 0; }
    .cloud-one { left: -10%; top: 18%; transform: scale(.7); }
    .cloud-two { left: 36%; top: 10%; transform: scale(.46); animation-delay: -9s; }

    .waves, .road { position: absolute; left: -5%; width: 110%; }
    .waves { height: 23%; bottom: 28%; background: #5bb8bb; border-radius: 50% 50% 0 0 / 20% 20% 0 0; }
    .waves::before, .waves::after { content: ""; position: absolute; inset: 18% 0 auto; height: 18%; background: #92d5d0; border-radius: 50%; transform: skewX(-12deg); }
    .waves::after { inset: 47% 0 auto; opacity: .6; transform: skewX(15deg); }
    .road { bottom: -7%; height: 34%; background: var(--road); border-radius: 50% 50% 0 0 / 42% 42% 0 0; }
    .road::before { content: ""; position: absolute; inset: 34% 0 auto; height: 8px; background: repeating-linear-gradient(90deg, transparent 0 46px, #fff3cf 46px 78px); animation: lane 1.2s linear infinite; }

    .title {
      position: absolute;
      z-index: 5;
      top: 7%;
      left: 7%;
      margin: 0;
      max-width: 43%;
      font-size: clamp(2.4rem, 6vw, 5.8rem);
      line-height: .88;
      letter-spacing: -.07em;
      text-wrap: balance;
    }

    .subtitle { position: absolute; z-index: 5; top: 37%; left: 7.4%; font-size: clamp(.7rem, 1.25vw, 1rem); letter-spacing: .14em; }

    .scene {
      position: absolute;
      z-index: 3;
      left: 42%;
      bottom: 14%;
      width: 52%;
      height: 55%;
      animation: travel 4s ease-in-out infinite;
      transform-origin: center bottom;
    }

    .scene svg { width: 100%; height: 100%; overflow: visible; }
    .wheel { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite; }
    .pedal { transform-box: fill-box; transform-origin: center; animation: spin .8s linear infinite reverse; }
    .leg-front { transform-box: fill-box; transform-origin: 5% 10%; animation: pump-front .8s ease-in-out infinite alternate; }
    .leg-back { transform-box: fill-box; transform-origin: 12% 12%; animation: pump-back .8s ease-in-out infinite alternate; }
    .wing { transform-box: fill-box; transform-origin: 86% 28%; animation: wing 1.6s ease-in-out infinite; }
    .beak { transform-box: fill-box; transform-origin: 0 50%; animation: beak 2.4s ease-in-out infinite; }

    .controls {
      position: absolute;
      z-index: 8;
      bottom: 4%;
      left: 7%;
      display: flex;
      gap: .55rem;
    }
    button {
      appearance: none;
      border: 1px solid rgb(24 54 76 / 32%);
      border-radius: 999px;
      background: rgb(255 247 233 / 68%);
      color: var(--ink);
      padding: .55rem .9rem;
      cursor: pointer;
      font: 600 .75rem/1 system-ui, sans-serif;
    }
    button:hover { background: #fff7e9; }
    .paused *, .paused::before, .paused::after { animation-play-state: paused !important; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes travel { 0%, 100% { transform: translateX(-3%) translateY(0); } 50% { transform: translateX(3%) translateY(-9px); } }
    @keyframes pump-front { to { transform: rotate(28deg); } }
    @keyframes pump-back { to { transform: rotate(-28deg); } }
    @keyframes wing { 50% { transform: rotate(-10deg) translateY(-6px); } }
    @keyframes beak { 48%, 54% { transform: rotate(8deg); } }
    @keyframes drift { from { translate: 0 0; } to { translate: 125vw 0; } }
    @keyframes lane { to { background-position: -78px 0; } }

    @media (max-aspect-ratio: 3 / 4) {
      .poster { width: 100vw; height: 100svh; aspect-ratio: auto; }
      .title { max-width: 78%; top: 9%; }
      .subtitle { top: 27%; }
      .scene { left: 7%; bottom: 19%; width: 90%; height: 47%; }
      .sun { width: 23%; right: 8%; top: 32%; }
      .waves { bottom: 28%; height: 18%; }
      .road { height: 29%; }
    }
  </style>
</head>
<body>
  <!--
    临时独立作品：原创 SVG 角色与 CSS 动画；没有外部资源或构建步骤。
    操作：空格键或右下角按钮可暂停/继续；重播会从第一帧重新开始。
  -->
  <main class="poster" id="poster" aria-label="一只鹈鹕沿海边骑自行车的二维动画">
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud cloud-one" aria-hidden="true"></div>
    <div class="cloud cloud-two" aria-hidden="true"></div>
    <h1 class="title">鹈鹕<br>去兜风</h1>
    <div class="subtitle">PELICAN CYCLING CLUB · COASTAL RIDE</div>
    <div class="waves" aria-hidden="true"></div>
    <div class="road" aria-hidden="true"></div>

    <div class="scene" aria-hidden="true">
      <svg viewBox="0 0 700 430" role="img">
        <g class="wheel" fill="none" stroke="#18364c" stroke-width="13">
          <circle cx="188" cy="329" r="74"/><circle cx="188" cy="329" r="7" fill="#18364c"/>
          <path d="M188 255v148M114 329h148M136 277l104 104M240 277L136 381" stroke-width="4" opacity=".55"/>
        </g>
        <g class="wheel" fill="none" stroke="#18364c" stroke-width="13">
          <circle cx="481" cy="329" r="74"/><circle cx="481" cy="329" r="7" fill="#18364c"/>
          <path d="M481 255v148M407 329h148M429 277l104 104M533 277L429 381" stroke-width="4" opacity=".55"/>
        </g>
        <g fill="none" stroke="#f47b61" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
          <path d="M188 329 298 193 391 329 188 329 335 329 298 193"/>
          <path d="M391 329 481 329 443 190"/>
          <path d="M298 193h83M443 190l34-44h51"/>
        </g>
        <path d="M279 184h89" stroke="#18364c" stroke-width="18" stroke-linecap="round"/>
        <g class="pedal" fill="none" stroke="#18364c" stroke-width="12" stroke-linecap="round">
          <circle cx="335" cy="329" r="25"/>
          <path d="M335 329 365 365M357 366h34M335 329 307 292M280 291h34"/>
        </g>

        <g class="leg-back">
          <path d="M317 219c8 43 7 77 21 110" fill="none" stroke="#f5dfb7" stroke-width="28" stroke-linecap="round"/>
          <path d="M338 328 369 364" fill="none" stroke="#f5dfb7" stroke-width="24" stroke-linecap="round"/>
          <path d="M365 365h44" fill="none" stroke="#f47b61" stroke-width="17" stroke-linecap="round"/>
        </g>
        <g class="leg-front">
          <path d="M356 219c29 36 41 67 10 102" fill="none" stroke="#f5dfb7" stroke-width="28" stroke-linecap="round"/>
          <path d="M366 320 306 292" fill="none" stroke="#f5dfb7" stroke-width="24" stroke-linecap="round"/>
          <path d="M306 292h-44" fill="none" stroke="#f47b61" stroke-width="17" stroke-linecap="round"/>
        </g>

        <path class="wing" d="M332 150c-62 2-79 58-51 94 30 39 108 8 94-43-8-29-20-47-43-51Z" fill="#f5dfb7" stroke="#18364c" stroke-width="9"/>
        <path d="M331 198c38 3 69-16 87-54" fill="none" stroke="#18364c" stroke-width="9" stroke-linecap="round"/>
        <path d="M355 85c-40 8-66 42-63 84 3 43 34 65 73 55 48-12 63-77 29-117-11-13-25-24-39-22Z" fill="#f5dfb7" stroke="#18364c" stroke-width="9"/>
        <path class="beak" d="M314 119c-50 2-96 18-121 49 36 23 97 22 128 2 13-8 19-22 18-35-1-10-10-17-25-16Z" fill="#ffc96b" stroke="#18364c" stroke-width="9" stroke-linejoin="round"/>
        <path d="M207 155c29 4 72 2 106-9" fill="none" stroke="#f47b61" stroke-width="8" stroke-linecap="round"/>
        <circle cx="346" cy="111" r="8" fill="#18364c"/>
        <path d="M325 83c18-19 45-21 62-6" fill="none" stroke="#f47b61" stroke-width="14" stroke-linecap="round"/>
        <path d="M361 183c33-3 62 8 75 28-29 17-64 16-83 0" fill="#147d82" stroke="#18364c" stroke-width="9" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="controls no-record">
      <button type="button" id="toggle">暂停</button>
      <button type="button" id="restart">重播</button>
    </div>
  </main>
  <script>
    const poster = document.querySelector('#poster');
    const toggle = document.querySelector('#toggle');
    const restart = document.querySelector('#restart');
    const setPaused = (paused) => {
      poster.classList.toggle('paused', paused);
      toggle.textContent = paused ? '继续' : '暂停';
    };
    toggle.addEventListener('click', () => setPaused(!poster.classList.contains('paused')));
    restart.addEventListener('click', () => {
      const wasPaused = poster.classList.contains('paused');
      poster.classList.remove('paused');
      poster.getAnimations().forEach((animation) => { animation.cancel(); animation.play(); });
      setPaused(wasPaused);
    });
    window.addEventListener('keydown', (event) => {
      if (event.code === 'Space' && event.target.tagName !== 'BUTTON') {
        event.preventDefault();
        setPaused(!poster.classList.contains('paused'));
      }
    });
    window.__ready = true;
  </script>
</body>
</html>
