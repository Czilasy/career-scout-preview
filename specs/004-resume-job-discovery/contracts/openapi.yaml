openapi: 3.1.0
info:
  title: Resume Job Discovery API
  version: 1.0.0
  description: New default discovery contract. Legacy workbench and screening APIs remain unchanged.
servers:
  - url: http://127.0.0.1:5000
paths:
  /api/discovery/analyses:
    post:
      summary: Start candidate analysis for an existing uploaded resume
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resume_id, ai_consent]
              properties:
                resume_id: {type: string}
                ai_consent: {type: boolean}
      responses:
        '202':
          description: Immutable analysis attempt persisted and submitted; poll the analysis resource for ready or a mapped safe failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisSummary'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/discovery/analyses/{analysis_id}:
    get:
      summary: Get analysis, evidence summary, unknowns and directions
      parameters:
        - {$ref: '#/components/parameters/AnalysisId'}
      responses:
        '200':
          description: Analysis state
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Analysis'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/discovery/analyses/{analysis_id}/retry:
    post:
      summary: Create a new analysis attempt for the same resume
      parameters:
        - {$ref: '#/components/parameters/AnalysisId'}
      responses:
        '202':
          description: New analysis accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AnalysisSummary'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/discovery/confirmations:
    post:
      summary: Freeze enabled directions and current user intent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmationRequest'}
      responses:
        '201':
          description: Immutable confirmation created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Confirmation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/discovery/runs:
    post:
      summary: Start discovery from a confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation_id]
              properties:
                confirmation_id: {type: string}
                limits:
                  $ref: '#/components/schemas/SafeLimits'
      responses:
        '202':
          description: Run and plan persisted and dispatch attempted; returned state must advance to planning or expose a safe dispatch failure
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/discovery/runs/{run_id}:
    get:
      summary: Get persisted run state and progress
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '200':
          description: Current run
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/discovery/runs/{run_id}/cancel:
    post:
      summary: Request real cancellation while preserving saved work
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '202':
          description: Cancellation accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/discovery/runs/{run_id}/resume:
    post:
      summary: Resume an eligible interrupted or partial run
      parameters:
        - {$ref: '#/components/parameters/RunId'}
      responses:
        '202':
          description: Resume accepted
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/discovery/runs/{run_id}/results:
    get:
      summary: List safe, direction-aware job results
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/Category'
        - name: direction_id
          in: query
          schema: {type: string}
        - name: after
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Result page
          content:
            application/json:
              schema:
                type: object
                required: [items, counts]
                properties:
                  items:
                    type: array
                    items: {$ref: '#/components/schemas/JobResult'}
                  counts:
                    type: object
                    additionalProperties: {type: integer, minimum: 0}
                  next: {type: [string, 'null']}
  /api/discovery/runs/{run_id}/jobs/{job_id}/retry:
    post:
      summary: Retry missing detail or pending assessments for one job
      parameters:
        - {$ref: '#/components/parameters/RunId'}
        - name: job_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '202':
          description: Retry accepted
        '409': {$ref: '#/components/responses/Conflict'}
  /api/discovery/feedback:
    get:
      summary: List effective feedback and visible preference changes
      parameters:
        - name: profile_id
          in: query
          required: true
          schema: {type: string}
        - name: run_id
          in: query
          required: false
          schema: {type: string}
      responses:
        '200':
          description: Effective feedback state
          content:
            application/json:
              schema:
                type: object
                required: [items, preference_changes]
                properties:
                  items: {type: array, items: {$ref: '#/components/schemas/Feedback'} }
                  preference_changes: {type: array, items: {$ref: '#/components/schemas/PreferenceChange'} }
        '400': {$ref: '#/components/responses/BadRequest'}
    post:
      summary: Record reversible job/direction/assessment feedback
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FeedbackRequest'}
      responses:
        '201':
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                required: [feedback_id, effective_scope]
                properties:
                  feedback_id: {type: string}
                  effective_scope: {type: string}
                  preference_changes: {type: array, items: {$ref: '#/components/schemas/PreferenceChange'} }
        '400': {$ref: '#/components/responses/BadRequest'}
  /api/discovery/feedback/{feedback_id}/revoke:
    post:
      summary: Revoke feedback without rewriting history
      parameters:
        - name: feedback_id
          in: path
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked: {type: boolean, const: true}
                  preference_changes: {type: array, items: {$ref: '#/components/schemas/PreferenceChange'} }
components:
  parameters:
    AnalysisId:
      name: analysis_id
      in: path
      required: true
      schema: {type: string}
    RunId:
      name: run_id
      in: path
      required: true
      schema: {type: string}
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: State conflict or blocked transition
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [error_code, user_message, retryable]
      properties:
        error_code:
          type: string
          enum: [ai_timeout, ai_auth_failed, ai_network_error, ai_invalid_output, ai_uncertain, evidence_reference_invalid, snapshot_unavailable, snapshot_expired, experience_level_conflict, hard_rule_unknown, input_incomplete, verification_error, dispatch_failed, state_conflict, not_found]
        user_message: {type: string}
        stage: {type: [string, 'null']}
        retryable: {type: boolean}
    AnalysisSummary:
      type: object
      required: [analysis_id, resume_id, profile_id, status]
      properties:
        analysis_id: {type: string}
        resume_id: {type: string}
        profile_id: {type: string}
        status: {type: string, enum: [queued, analyzing, ready, failed, deleted]}
        failure: {$ref: '#/components/schemas/Error'}
    Evidence:
      type: object
      required: [id, type, normalized_value, assertion_type, confidence]
      properties:
        id: {type: string}
        type: {type: string}
        normalized_value: {type: string}
        safe_excerpt: {type: string}
        assertion_type: {type: string, enum: [explicit, inferred]}
        confidence: {type: number, minimum: 0, maximum: 100}
    Direction:
      type: object
      required: [id, name, type, evidence_ids, gaps, confidence, default_enabled, search_terms]
      properties:
        id: {type: string}
        name: {type: string}
        type: {type: string, enum: [core, adjacent, growth]}
        rationale: {type: string}
        evidence_ids: {type: array, items: {type: string}}
        gaps: {type: array, items: {type: string}}
        confidence: {type: number, minimum: 0, maximum: 100}
        default_enabled: {type: boolean}
        search_terms: {type: array, minItems: 1, maxItems: 3, items: {type: string}}
    Analysis:
      allOf:
        - {$ref: '#/components/schemas/AnalysisSummary'}
        - type: object
          properties:
            summary: {type: object, additionalProperties: true}
            evidence: {type: array, items: {$ref: '#/components/schemas/Evidence'}}
            unknowns: {type: array, items: {type: object, additionalProperties: true}}
            directions: {type: array, maxItems: 5, items: {$ref: '#/components/schemas/Direction'}}
            failure: {$ref: '#/components/schemas/Error'}
    SafeLimits:
      type: object
      properties:
        max_search_items: {type: integer, minimum: 1, maximum: 12, default: 12}
        pages_per_item: {type: integer, minimum: 1}
        max_details: {type: integer, minimum: 1, default: 60}
      additionalProperties: false
    ConfirmationRequest:
      type: object
      required: [analysis_id, enabled_direction_ids, hard_constraints, soft_preferences]
      properties:
        analysis_id: {type: string}
        enabled_direction_ids: {type: array, minItems: 1, maxItems: 5, items: {type: string}}
        user_directions: {type: array, items: {type: object, additionalProperties: true}}
        hard_constraints: {type: object, additionalProperties: true}
        soft_preferences: {type: object, additionalProperties: true}
        safe_limits: {$ref: '#/components/schemas/SafeLimits'}
    Confirmation:
      type: object
      required: [confirmation_id, analysis_id, version, enabled_direction_ids, confirmed_at]
      properties:
        confirmation_id: {type: string}
        analysis_id: {type: string}
        version: {type: integer, minimum: 1}
        enabled_direction_ids: {type: array, items: {type: string}}
        confirmed_at: {type: string, format: date-time}
    Run:
      type: object
      required: [run_id, confirmation_id, status, stage, progress, counts, updated_at]
      properties:
        run_id: {type: string}
        confirmation_id: {type: string}
        status:
          type: string
          enum: [created, planning, fetching_lists, fetching_details, evaluating, assembling, succeeded, partial, failed, interrupted, cancelled]
        stage: {type: string}
        progress: {type: object, additionalProperties: {type: integer, minimum: 0}}
        counts: {type: object, additionalProperties: {type: integer, minimum: 0}}
        failure: {$ref: '#/components/schemas/Error'}
        updated_at: {type: string, format: date-time}
    Category:
      type: string
      enum: [high_match, adjacent_match, growth_match, needs_review, not_suitable]
    AssessmentSummary:
      type: object
      required: [direction_id, direction_name, category, hard_outcome, evidence, gaps]
      properties:
        direction_id: {type: string}
        direction_name: {type: string}
        category: {$ref: '#/components/schemas/Category'}
        hard_outcome: {type: string, enum: [pass, violation, unknown]}
        match_score: {type: [number, 'null'], minimum: 0, maximum: 100}
        confidence: {type: [number, 'null'], minimum: 0, maximum: 100}
        evidence: {type: array, items: {type: object, additionalProperties: true}}
        gaps: {type: array, items: {type: string}}
        failure_code: {type: [string, 'null']}
    JobResult:
      type: object
      required: [job_id, title, company, source_url, completeness, primary_assessment, assessments]
      properties:
        job_id: {type: string}
        title: {type: string}
        company: {type: string}
        salary: {type: string}
        location: {type: string}
        tags: {type: string}
        jd_excerpt: {type: string}
        source_url: {type: string, format: uri}
        source_status: {type: string, enum: [active, unknown, closed, unreachable]}
        completeness: {type: string, enum: [complete, partial, unavailable, expired]}
        missing_fields: {type: array, items: {type: string}}
        primary_assessment: {$ref: '#/components/schemas/AssessmentSummary'}
        assessments: {type: array, items: {$ref: '#/components/schemas/AssessmentSummary'}}
        interest_state: {type: string}
    FeedbackRequest:
      type: object
      required: [profile_id, target_type, action]
      properties:
        profile_id: {type: string}
        run_id: {type: string}
        job_id: {type: string}
        target_id: {type: string}
        direction_id: {type: string}
        assessment_id: {type: string}
        target_type: {type: string, enum: [job, direction, assessment, constraint]}
        action: {type: string}
        reason_code: {type: string}
        scope: {type: string, default: exact_job}
        note: {type: string, maxLength: 500}
    Feedback:
      type: object
      required: [id, target_type, action, scope, created_at]
      properties:
        id: {type: string}
        run_id: {type: [string, 'null']}
        job_id: {type: [string, 'null']}
        direction_id: {type: [string, 'null']}
        target_type: {type: string}
        action: {type: string}
        reason_code: {type: [string, 'null']}
        scope: {type: string}
        created_at: {type: string, format: date-time}
    PreferenceChange:
      type: object
      required: [feedback_id, kind, created_at]
      properties:
        feedback_id: {type: string}
        kind: {type: string, enum: [direction_disabled, job_excluded, job_interested]}
        job_id: {type: [string, 'null']}
        direction_id: {type: [string, 'null']}
        reason_code: {type: [string, 'null']}
        scope: {type: [string, 'null']}
        created_at: {type: string, format: date-time}
