name: release-macos

# 与 Windows EXE 同版本发布：推 vX.Y.Z tag 后在 GitHub 的 macOS runner
# 上构建 dmg（arm64，覆盖 Apple Silicon Mac；PyPI 依赖 wheel 无
# universal2，无法双架构），自动挂到该 tag 对应的 Release（已有则
# 附加，没有则创建）。构建机是 GitHub 的 Mac，维护者无需本地 macOS。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发布前测试门禁：后端全量不过，不进入 DMG 构建与上传（FR-024）
  test-gate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装项目依赖
        run: uv sync --python 3.11

      - name: 后端全量测试
        run: uv run python -m unittest discover -s tests

  build-dmg:
    needs: test-gate
    runs-on: macos-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装项目依赖
        run: uv sync --python 3.11

      - name: 构建 DMG
        run: bash packaging/build_dmg.sh

      - name: 校验产物
        run: ls -lh .release/*.dmg

      # dmg 自检：挂载镜像确认 .app 存在、主二进制架构正确、镜像完整性
      - name: 自检 DMG 产物
        run: |
          set -euo pipefail
          DMG="$(ls .release/*.dmg | head -n1)"
          hdiutil verify "$DMG"
          MOUNT=/tmp/ci-dmg-check
          rm -rf "$MOUNT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          test -d "$MOUNT/CareerScout.app" || { echo "dmg 内缺少 CareerScout.app"; exit 1; }
          BIN="$MOUNT/CareerScout.app/Contents/MacOS/CareerScout"
          test -f "$BIN" || { echo "app 主二进制缺失"; exit 1; }
          lipo -info "$BIN"
          python3 -c "import plistlib,sys; p=plistlib.load(open('$MOUNT/CareerScout.app/Contents/Info.plist','rb')); print('version:', p.get('CFBundleShortVersionString')); assert p.get('CFBundleShortVersionString'), '版本号为空'"
          hdiutil detach "$MOUNT"
          echo "DMG 自检通过"

      - name: 生成 SHA256 校验文件
        run: |
          cd .release
          for f in *.dmg; do shasum -a 256 "$f" > "$f.sha256"; done
          ls -lh

      # 留档便于排错（构建失败时下载 artifact 检查 dmg 内容）；
      # upload-artifact 的 glob 不认 .release 隐藏目录，先拷到普通目录
      - name: 上传构建产物（artifact）
        run: |
          mkdir -p dmg-artifact
          cp .release/*.dmg .release/*.dmg.sha256 dmg-artifact/
      - uses: actions/upload-artifact@v4
        with:
          name: CareerScout-macos-dmg
          path: |
            dmg-artifact/*.dmg
            dmg-artifact/*.sha256

      - name: 附加 DMG 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .release/*.dmg
            .release/*.sha256
          draft: false
          prerelease: false

      # 同步到自建国内更新镜像（静态分发，应用内更新优先源）。
      # 配置经仓库 vars/secrets 注入（FR-005：地址与账号不写进公开仓库）：
      #   vars.MIRROR_HOST / vars.MIRROR_USER / vars.MIRROR_PATH
      #   secrets.MIRROR_SSH_KEY / secrets.MIRROR_KNOWN_HOSTS（固化主机指纹，替代 ssh-keyscan）
      # 任一缺失或同步失败不阻断发布，输出醒目提示。
      - name: 同步 DMG 到更新镜像
        continue-on-error: true
        timeout-minutes: 45
        env:
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
          MIRROR_HOST: ${{ vars.MIRROR_HOST }}
          MIRROR_USER: ${{ vars.MIRROR_USER }}
          MIRROR_PATH: ${{ vars.MIRROR_PATH }}
        run: |
          set -euo pipefail
          missing=""
          for v in MIRROR_SSH_KEY MIRROR_KNOWN_HOSTS MIRROR_HOST MIRROR_USER MIRROR_PATH; do
            [ -n "${!v:-}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "=========================================================="
            echo "!! 镜像同步跳过：仓库未配置以下 vars/secrets（不阻断发布） !!"
            echo "!! 缺失项：$missing"
            echo "=========================================================="
            exit 0
          fi
          DMG="$(ls .release/*.dmg | head -n1)"
          VERSION="${DMG#*v}"; VERSION="${VERSION%.dmg}"
          SHA="$(shasum -a 256 "$DMG" | awk '{print $1}')"
          SIZE="$(stat -f%z "$DMG")"
          SSH_OPTS="-i ~/.ssh/mirror_deploy -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=3"
          mkdir -p ~/.ssh
          printf '%s\n' "$MIRROR_SSH_KEY" > ~/.ssh/mirror_deploy
          chmod 600 ~/.ssh/mirror_deploy
          printf '%s\n' "$MIRROR_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          # 跨境链路不稳：限时长、断线即退，传完必须远程校验哈希，防止半截文件
          for attempt in 1 2 3; do
            scp $SSH_OPTS "$DMG" "$DMG.sha256" "$MIRROR_USER@$MIRROR_HOST:$MIRROR_PATH/" && break
            [ "$attempt" = 3 ] && { echo "镜像上传三次均失败"; exit 1; }
            echo "上传失败（第 $attempt 次），10 秒后重试"; sleep 10
          done
          FILE="$(basename "$DMG")"
          REMOTE_SHA="$(ssh $SSH_OPTS "$MIRROR_USER@$MIRROR_HOST" "sha256sum '$MIRROR_PATH/$FILE'" | awk '{print $1}')"
          if [ "$REMOTE_SHA" != "$SHA" ]; then
            echo "远程 DMG 哈希不一致（$REMOTE_SHA != $SHA），中止同步"; exit 1
          fi
          ssh $SSH_OPTS "$MIRROR_USER@$MIRROR_HOST" \
            "python3 ~/update_manifest.py '$VERSION' mac '$FILE' '$SHA' $SIZE"
          echo "镜像已同步 mac 条目：v$VERSION"
